services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: africanet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/africanet_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: default
      FLOUCI_PUBLIC_KEY: your_public_key_here
      FLOUCI_PRIVATE_KEY: your_private_key_here
      FLOUCI_BASE_URL: https://developers.flouci.com/api
      FLOUCI_SUCCESS_LINK: http://localhost:3000/payment/success
      FLOUCI_FAIL_LINK: http://localhost:3000/payment/fail
      FLOUCI_WEBHOOK: http://localhost:8081/api/payments/webhook

  frontend:
    build: ./sprint3-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
