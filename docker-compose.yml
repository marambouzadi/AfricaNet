services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: africanet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d africanet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/africanet_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: default
      FLOUCI_PUBLIC_KEY: ${FLOUCI_PUBLIC_KEY:-your_public_key_here}
      FLOUCI_PRIVATE_KEY: ${FLOUCI_PRIVATE_KEY:-your_private_key_here}
      FLOUCI_BASE_URL: https://developers.flouci.com/api
      FLOUCI_SUCCESS_LINK: http://localhost:3000/payment/success
      FLOUCI_FAIL_LINK: http://localhost:3000/payment/fail
      FLOUCI_WEBHOOK: http://localhost:8090/api/payments/webhook

frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8090/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api

volumes:
  postgres_data:
  ollama_data:
