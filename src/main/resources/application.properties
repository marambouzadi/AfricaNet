spring.application.name=africanet

# ================================================
# Base de donnees PostgreSQL
# ================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/africanet_db
spring.datasource.username=postgres
spring.datasource.password=Maram.2002

# ================================================
# JPA / Hibernate
# ================================================
# validate = ne modifie jamais le schema, verifie juste la coherence
# (le schema est gere par Liquibase, pas par Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================================
# Liquibase (migrations de schema)
# ================================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ================================================
# Serveur
# ================================================
server.port=8090

# ================================================
# JWT (JSON Web Token)
# ================================================
# Cle secrete HMAC-SHA256 (minimum 32 caracteres / 256 bits)
# ATTENTION: en production, cette cle doit venir d'une variable
# d'environnement, jamais du code source en clair
jwt.secret=AfricaNet$BRNSmart$SecretKey$2025$VeryLongAndSecureKey!

# Duree de vie de l'access token : 15 minutes (en millisecondes)
jwt.access-token-expiration=900000

# Duree de vie du refresh token : 7 jours (en millisecondes)
jwt.refresh-token-expiration=604800000

# ================================================
# Swagger / SpringDoc (documentation API)
# ================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
logging.level.org.springframework.security=DEBUG