langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=qwen3:8b
langchain4j.ollama.chat-model.timeout=120s
langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.model-name=qwen3:8b
langchain4j.ollama.streaming-chat-model.timeout=120s
server.port=8081

# Debug tool execution
logging.level.dev.langchain4j=DEBUG

# PostgreSQL — shared DB with backend
spring.datasource.url=jdbc:postgresql://localhost:5432/africanet_db
spring.datasource.username=postgres
spring.datasource.password=Maram.2002

# Hibernate: update = creates missing tables (device_base_values), validates existing ones
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-numberOf-calls-in-half-open-state=3