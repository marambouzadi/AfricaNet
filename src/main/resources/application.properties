spring.application.name=africanet

# ================================================
# Base de donnees PostgreSQL
# ================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/africanet_db
spring.datasource.username=postgres
spring.datasource.password=Maram.2002

# ================================================
# JPA / Hibernate
# ================================================
# validate = ne modifie jamais le schema, verifie juste la coherence
# (le schema est gere par Liquibase, pas par Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================================
# Liquibase (migrations de schema)
# ================================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ================================================
# Serveur
# ================================================
server.port=8090
app.upload.dir=src/main/resources/products
app.base-url=http://localhost:8090

# ================================================
# JWT (JSON Web Token)
# ================================================
# Cle secrete HMAC-SHA256 (minimum 32 caracteres / 256 bits)
# ATTENTION: en production, cette cle doit venir d'une variable
# d'environnement, jamais du code source en clair
jwt.secret=AfricaNet$BRNSmart$SecretKey$2025$VeryLongAndSecureKey!

# Duree de vie de l'access token : 15 minutes (en millisecondes)
jwt.access-token-expiration=900000

# Duree de vie du refresh token : 7 jours (en millisecondes)
jwt.refresh-token-expiration=604800000

# ================================================
# Swagger / SpringDoc (documentation API)
# ================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
logging.level.org.springframework.security=DEBUG


# ================================================
#ajouter flouci api
# ================================================
flouci.public-key=fake-public-key
flouci.private-key=fake-private-key
flouci.base-url=http://localhost:8090/mock-flouci/api/v2
flouci.success-link=http://localhost:3000/checkout/success
flouci.fail-link=http://localhost:3000/checkout/fail
flouci.webhook=http://localhost:8090/api/payments/flouci/webhook

# ================================================
# Spring Batch
# ================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.name=

# ================================================
# LangChain4j / Ollama (AI Chatbot)
# ================================================
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.timeout=300s
langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.timeout=300s
langchain4j.ollama.chat-model.model-name=qwen2.5:1.5b
langchain4j.ollama.streaming-chat-model.model-name=qwen2.5:1.5b

# Debug tool execution
logging.level.dev.langchain4j=DEBUG

# ================================================
# Redis (Chat Memory Store)
# ================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================================
# Resilience4j Circuit Breaker (AI fallback)
# ================================================
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-numberOf-calls-in-half-open-state=3