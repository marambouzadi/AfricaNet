databaseChangeLog:
  # ==================== TABLE ORDERS ====================
  - changeSet:
      id: 005-1-create-orders-table
      author: maram
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_user
                    references: users(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: DECIMAL(10,3)
                  constraints:
                    nullable: false
              - column:
                  name: tax_amount
                  type: DECIMAL(10,3)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: shipping_amount
                  type: DECIMAL(10,3)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: discount_amount
                  type: DECIMAL(10,3)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(10,3)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: billing_address
                  type: JSONB
              - column:
                  name: coupon_code
                  type: VARCHAR(50)
              - column:
                  name: payment_method
                  type: VARCHAR(50)
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: customer_notes
                  type: TEXT
              - column:
                  name: internal_notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  # ==================== CONTRAINTES CHECK ORDERS ====================
  - changeSet:
      id: 005-2-add-orders-check-constraints
      author: maram
      changes:
        - sql:
            sql: >
              ALTER TABLE orders ADD CONSTRAINT chk_orders_status
              CHECK (status IN ('PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED','REFUNDED'));
        - sql:
            sql: >
              ALTER TABLE orders ADD CONSTRAINT chk_orders_payment_status
              CHECK (payment_status IN ('PENDING','PAID','FAILED','REFUNDED'));
        - sql:
            sql: >
              ALTER TABLE orders ADD CONSTRAINT chk_orders_payment_method
              CHECK (payment_method IS NULL OR payment_method IN ('CASH_ON_DELIVERY','CARD','VIREMENT'));
        - sql:
            sql: ALTER TABLE orders ADD CONSTRAINT chk_orders_subtotal CHECK (subtotal >= 0);
        - sql:
            sql: ALTER TABLE orders ADD CONSTRAINT chk_orders_total CHECK (total_amount >= 0);

  # ==================== TABLE ORDER_ITEMS ====================
  - changeSet:
      id: 005-3-create-order-items-table
      author: maram
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_order_items_product
                    references: products(id)
              - column:
                  name: product_snapshot
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(10,3)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(10,3)
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-4-add-order-items-check-constraints
      author: maram
      changes:
        - sql:
            sql: ALTER TABLE order_items ADD CONSTRAINT chk_order_items_quantity CHECK (quantity > 0);
        - sql:
            sql: ALTER TABLE order_items ADD CONSTRAINT chk_order_items_unit_price CHECK (unit_price >= 0);
        - sql:
            sql: ALTER TABLE order_items ADD CONSTRAINT chk_order_items_total_price CHECK (total_price >= 0);

  # ==================== TABLE ORDER_STATUS_HISTORY ====================
  - changeSet:
      id: 005-5-create-order-status-history-table
      author: maram
      changes:
        - createTable:
            tableName: order_status_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_history_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: changed_by
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_order_history_user
                    references: users(id)
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-6-add-order-history-check-constraint
      author: maram
      changes:
        - sql:
            sql: >
              ALTER TABLE order_status_history ADD CONSTRAINT chk_order_history_status
              CHECK (status IN ('PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED','REFUNDED'));

  # ==================== TABLE SHIPMENTS ====================
  - changeSet:
      id: 005-7-create-shipments-table
      author: maram
      changes:
        - createTable:
            tableName: shipments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_shipments_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: carrier
                  type: VARCHAR(100)
              - column:
                  name: tracking_number
                  type: VARCHAR(100)
              - column:
                  name: tracking_url
                  type: VARCHAR(500)
              - column:
                  name: estimated_delivery
                  type: DATE
              - column:
                  name: shipped_at
                  type: TIMESTAMP
              - column:
                  name: delivered_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PREPARING

  - changeSet:
      id: 005-8-add-shipments-check-constraint
      author: maram
      changes:
        - sql:
            sql: >
              ALTER TABLE shipments ADD CONSTRAINT chk_shipments_status
              CHECK (status IN ('PREPARING','SHIPPED','IN_TRANSIT','DELIVERED','FAILED'));

  # ==================== INDEXES ====================
  - changeSet:
      id: 005-9-create-orders-indexes
      author: maram
      changes:
        - createIndex:
            indexName: idx_orders_user
            tableName: orders
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_orders_status
            tableName: orders
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_orders_number
            tableName: orders
            columns:
              - column:
                  name: order_number
        - createIndex:
            indexName: idx_orders_payment_status
            tableName: orders
            columns:
              - column:
                  name: payment_status

  - changeSet:
      id: 005-10-create-order-items-indexes
      author: maram
      changes:
        - createIndex:
            indexName: idx_order_items_order
            tableName: order_items
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_order_items_product
            tableName: order_items
            columns:
              - column:
                  name: product_id

  - changeSet:
      id: 005-11-create-order-history-indexes
      author: maram
      changes:
        - createIndex:
            indexName: idx_order_history_order
            tableName: order_status_history
            columns:
              - column:
                  name: order_id
              - column:
                  name: changed_at
                  descending: true

  - changeSet:
      id: 005-12-create-shipments-indexes
      author: maram
      changes:
        - createIndex:
            indexName: idx_shipments_tracking
            tableName: shipments
            columns:
              - column:
                  name: tracking_number
        - createIndex:
            indexName: idx_shipments_status
            tableName: shipments
            columns:
              - column:
                  name: status